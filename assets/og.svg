<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- OG 배너 1200x630 — 로고/타이틀/슬로건 가로 중앙, 세로 중앙 클러스터 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 브랜드 마크 — 가로 중앙. translate x = 600 - 1024*0.20/2 = 498. -->
  <g transform="translate(498, 130) scale(0.20)">
    <rect x="280" y="220" width="160" height="600" rx="40" fill="none" stroke="#ffffff" stroke-width="80"/>
    <rect x="280" y="660" width="460" height="160" rx="40" fill="none" stroke="#ffffff" stroke-width="80"/>
  </g>

  <!-- 사이트명 — 가운데 -->
  <text x="600" y="400" text-anchor="middle" fill="#FAFAFA" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="92" font-weight="700" letter-spacing="-2">LAYOUTNEMO</text>

  <!-- 슬로건 — 가운데 -->
  <text x="600" y="460" text-anchor="middle" fill="#A1A1AA" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="34" font-weight="400">Thinking space for work</text>

  <!-- 도메인 — 우하단 -->
  <text x="1120" y="580" text-anchor="end" fill="#52525B" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="22">layoutnemo.com</text>
</svg>
