<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />

  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />

  <link rel="canonical" href="{{ page.url | absolute_url }}" />

  {% feed_meta %}
  {% seo title=false %}

  <!-- 사이트 favicon / 검색 결과 작은 아이콘 -->
  <link rel="icon" href="{{ '/assets/logo.svg' | relative_url }}" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="{{ '/assets/logo.svg' | relative_url }}" />

  <!-- Open Graph 미리보기 (카톡/슬랙/페북) -->
  {% assign og_image = '/assets/og.png' | relative_url %}
  <meta property="og:image" content="{{ site.url }}{{ og_image }}" />
  <meta property="og:image:secure_url" content="{{ site.url }}{{ og_image }}" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="{{ site.title }} — {{ site.description }}" />
  <meta property="og:site_name" content="{{ site.title }}" />
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}" />
  <meta property="og:locale" content="ko_KR" />

  <!-- Twitter / X 카드 -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="{{ site.url }}{{ og_image }}" />
  {% if site.twitter.username %}<meta name="twitter:site" content="@{{ site.twitter.username }}" />{% endif %}

  <!-- 구조화 데이터: Organization (구글 검색 결과의 로고/사이트명 인식) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "{{ site.title }}",
    "url": "{{ site.url }}{{ site.baseurl }}/",
    "logo": "{{ site.url }}{{ '/assets/logo.svg' | relative_url }}"
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "{{ site.title }}",
    "url": "{{ site.url }}{{ site.baseurl }}/",
    "description": "{{ site.description }}",
    "inLanguage": "ko-KR"
  }
  </script>

  <!-- Pretendard (한글) + Inter (영문) + JetBrains Mono (코드) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
  />

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />

  {% if page.math %}
  <!-- KaTeX (math: true 페이지에서만) -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
    integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV"
    crossorigin="anonymous"
  />
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
    integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8"
    crossorigin="anonymous"
  ></script>
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05"
    crossorigin="anonymous"
    onload="renderMathInElement(document.body, { delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}] });"
  ></script>
  {% endif %}

  <!-- Theme bootstrap (FOUC 방지: 페인트 전에 다크모드 결정) -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var prefers = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved || (prefers ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
